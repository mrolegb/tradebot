app:
  mode: testnet
  log_level: INFO

exchange:
  name: binance_futures
  testnet: true
  rest_url: https://testnet.binancefuture.com
  websocket_url: wss://stream.binancefuture.com
  api_key_env: BINANCE_TESTNET_API_KEY
  api_secret_env: BINANCE_TESTNET_API_SECRET

trading:
  symbols:
    - BTCUSDT
    - ETHUSDT
  timeframe: 5m
  leverage: 1
  quote_balance: 1000

risk:
  max_risk_per_trade_percent: 1
  max_daily_loss_percent: 3
  max_open_positions: 1

cooldown:
  enabled: true
  after_loss_minutes: 10
  after_2_losses_minutes: 30
  after_3_losses_minutes: 120

storage:
  sqlite_path: data/binance_testnet.sqlite3

strategy:
  name: breakout
  params:
    lookback: 20
